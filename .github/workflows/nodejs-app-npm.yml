name: Node.js App CI with npm

on:
  workflow_call:
    inputs:
      pre-build-hook:
        required: false
        type: string
      node-version:
        required: false
        type: number
        default: 20
      docker-registry:
        required: false
        type: string
        default: ghcr.io
      docker-image-name:
        required: false
        type: string
        default: ${{ github.repository }}
      docker-username:
        required: false
        type: string
        default: ${{ github.actor }}
    secrets:
      DOCKER_PASSWORD:
        required: false

jobs:
  node-js-build:
    name: ⬢ Node.js build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚡ Pre build hook
        if: ${{ inputs['pre-build-hook'] != '' }}
        run: ${{ inputs['pre-build-hook'] }}

      - name: 🔋 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: ♻️ Cache node modules
        id: cache-node-modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: 🔧 Run clean install
        run: npm ci
        if: ${{ steps.cache-node-modules.outputs.cache-hit != 'true' }}

      - name: 🔍 Run tests
        run: npm run test

      - name: 🗜️ Archive reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ github.workflow }}-${{ github.run_id }}-${{ job.check_run_id }}
          path: ./build/reports

      - name: 📦 Run production packaging
        run: npm run dist

      - name: 💻 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 👷‍♂️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ inputs.docker-username }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: 🏷 Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.docker-registry }}/${{ inputs.docker-image-name }}
          tags: |
            type=ref,event=tag
            type=ref,event=pr,suffix=-{{ sha }}

      - name: 🐋 Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.nginx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max