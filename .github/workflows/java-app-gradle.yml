name: Java App CI with Gradle

on:
  workflow_call:
    inputs:
      native:
        required: false
        type: boolean
        default: false
      pre-build-hook:
        required: false
        type: string
      java-version:
        required: false
        type: string
        default: '21'
      docker-registry:
        required: false
        type: string
        default: ghcr.io
      docker-image-name:
        required: false
        type: string
        default: ${{ github.repository }}
      docker-username:
        required: false
        type: string
        default: ${{ github.actor }}
    secrets:
      DOCKER_PASSWORD:
        required: false

jobs:
  gradle-build:
    name: 🐘 Gradle build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚡ Pre-build script
        if: ${{ inputs['pre-build-hook'] != '' }}
        run: ${{ inputs['pre-build-hook'] }}

      - name: ♻️ Cache build
        id: cache-build
        uses: actions/cache@v4
        with:
          path: ./build
          key: ${{ github.run_id }}

      - name: 🔋 Set up Graal VM ${{ inputs.java-version }}
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'graalvm'
          cache: gradle
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: 📦 Run build
        run: ./gradlew build

      - name: 🗜️ Archive reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ github.workflow }}-${{ github.run_id }}-${{ job.check_run_id }}
          path: ./build/reports

      - name: 🚀 Build native image with Gradle
        if: ${{ inputs.native }}
        run: ./gradlew nativeCompile

      - name: 💻 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 👷‍♂️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ inputs.docker-username }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: 🏷 Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.docker-registry }}/${{ inputs.docker-image-name }}
          tags: |
            type=ref,event=tag
            type=ref,event=pr,suffix=-{{ sha }}

      - name: 🐋 Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            --progress=plain

      - name: 🏷 Extract metadata for Docker
        id: meta-native
        if: ${{ inputs.native }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.docker-registry }}/${{ inputs.docker-image-name }}
          tags: |
            type=ref,event=tag
            type=ref,event=pr,suffix=-{{ sha }}
          flavor:
            suffix=-native

      - name: 🐋 Build and push
        uses: docker/build-push-action@v5
        if: ${{ inputs.native }}
        with:
          context: .
          file: docker/Dockerfile.native
          push: true
          tags: ${{ steps.meta-native.outputs.tags }}
          labels: ${{ steps.meta-native.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max